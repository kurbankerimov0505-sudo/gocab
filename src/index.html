<style>
/* ============================================================
   GoCab Control — design tokens
   Brand colors sampled directly from the GoCab logo:
   navy #34538c, olive #57611e. Everything else in this file is
   derived from those two plus a neutral fintech-dashboard scale.
   ============================================================ */
:root{
  --navy:#34538c; --navy-dark:#223a63; --navy-light:#5878b3; --navy-50:#eef1f8; --navy-100:#dde4f1;
  --olive:#57611e; --olive-dark:#414a16; --olive-50:#f1f2e6;

  --ink:#101828; --ink-soft:#667085; --ink-faint:#98a2b3;
  --paper:#ffffff; --bg:#f7f8fb;
  --line:#e4e7ec; --line-soft:#eef1f5;

  --ok:#17845a; --ok-bg:#e7f6ef;
  --bad:#c0352a; --bad-bg:#fbeae9;
  --warn:#a9660a; --warn-bg:#fbf1e1;

  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.05);
  --topbar-h:60px;

  /* kept for any stray reference — now points at the real primary brand color */
  --amber:var(--navy);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body{ font-feature-settings:"tnum" 1, "cv11" 1; }
button, input, select, textarea{ font-family:inherit; font-size:14px; }
button{ cursor:pointer; }
h1,h2,h3{ letter-spacing:-.01em; }

/* ---------- shell ---------- */
.shell{ min-height:100vh; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; gap:12px; padding:0 18px; height:var(--topbar-h); background:var(--paper);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; }
.icon-btn{ background:none; border:1px solid transparent; border-radius:var(--radius-sm); width:34px; height:34px;
  display:inline-flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-soft); }
.icon-btn:hover{ background:var(--bg); color:var(--ink); }
.avatar{ width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; margin-right:8px; flex:none; }
.topbar-brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{ display:block; height:26px; width:auto; }
.brand-word{ font-weight:800; letter-spacing:-.01em; font-size:16px; color:var(--navy-dark); }
.role-pill{ background:var(--navy-50); border:1px solid var(--navy-100); border-radius:999px; padding:5px 12px; font-size:12px;
  color:var(--navy-dark); font-weight:600; }
.lang-switch{ display:flex; gap:2px; background:var(--bg); border-radius:var(--radius-sm); padding:2px; border:1px solid var(--line); }
.lang-btn{ border:none; background:transparent; border-radius:7px; padding:5px 9px; font-size:12px; font-weight:600; color:var(--ink-soft); }
.lang-btn.active{ background:var(--navy); color:#fff; }
.spacer{ flex:1; }
.acct-wrap{ position:relative; }
.acct-toggle{ display:flex; align-items:center; }
.acct-menu{ display:none; position:absolute; right:0; top:42px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-md); min-width:230px; padding:6px; z-index:40; }
.acct-menu.open{ display:block; }
.acct-menu-label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:8px 10px 4px; }
.acct-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:9px 10px; border-radius:var(--radius-sm); font-size:13px; }
.acct-item:hover{ background:var(--bg); }
.acct-item.active{ background:var(--navy-50); color:var(--navy-dark); font-weight:700; }

.main{ flex:1; display:flex; flex-direction:column; max-width:1180px; width:100%; margin:0 auto; padding:0 16px; }

/* ---------- drawer / sidebar ---------- */
.drawer-backdrop{ position:fixed; inset:0; background:rgba(16,24,40,.4); z-index:45; display:none; }
.drawer-backdrop.show{ display:block; }
.drawer{ position:fixed; top:0; left:0; bottom:0; width:280px; max-width:86vw; background:var(--paper);
  z-index:50; transform:translateX(-100%); transition:transform .22s ease; overflow-y:auto; box-shadow:var(--shadow-md); }
.drawer.open{ transform:translateX(0); }
.drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid var(--line); }
.drawer-brand{ display:flex; align-items:center; gap:9px; }
.drawer-brand .brand-mark{ height:30px; }
.drawer-brand .brand-word{ font-size:18px; }
.drawer-group-head{ width:100%; display:flex; justify-content:space-between; background:none; border:none;
  padding:14px 16px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; }
.drawer-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none;
  padding:9px 16px; margin:1px 8px; width:calc(100% - 16px); border-radius:var(--radius-sm); position:relative; font-size:13.5px; color:var(--ink); }
.drawer-item:hover{ background:var(--bg); }
.drawer-item.active{ background:var(--navy); color:#fff; font-weight:600; }
.drawer-item.active .di-icon{ opacity:1; }
.di-icon{ width:20px; text-align:center; opacity:.75; }
.di-badge{ margin-left:auto; background:var(--bad); color:#fff; border-radius:999px; font-size:10.5px; font-weight:700; padding:1px 7px; }

/* ---------- navtabs ---------- */
.navtabs{ display:flex; gap:6px; padding:16px 0 10px; overflow-x:auto; position:sticky; top:var(--topbar-h); background:var(--bg); z-index:20; }
.navtab{ border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:7px 15px; white-space:nowrap;
  color:var(--ink-soft); font-weight:600; font-size:13px; }
.navtab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

/* ---------- page / cards ---------- */
.page{ padding-bottom:40px; perspective:1200px; }
.card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px; margin-bottom:16px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
.card-head h3{ margin:0; font-size:15px; font-weight:700; }
.card-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.muted{ color:var(--ink-soft); font-size:12.5px; }
.empty-state{ text-align:center; color:var(--ink-soft); padding:34px 0; font-size:13.5px; }

.reveal{ transform-origin:top center; animation:blindsIn .38s ease both; }
@keyframes blindsIn{ from{ transform:rotateX(-78deg); opacity:0; } to{ transform:rotateX(0deg); opacity:1; } }
@media (prefers-reduced-motion: reduce){ .reveal{ animation:none !important; } }

/* ---------- table ---------- */
.table-card{ padding:0; overflow:hidden; }
.table-card .card-head{ padding:16px 18px 10px; margin:0; }
.table-scroll{ overflow-x:auto; }
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:left; padding:10px 14px; background:var(--bg); color:var(--ink-soft); font-weight:700;
  font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
  border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; }
.tbl td{ padding:11px 14px; border-bottom:1px solid var(--line-soft); white-space:nowrap; }
.tbl tbody tr:hover{ background:var(--navy-50); }
.table-foot{ display:flex; justify-content:space-between; align-items:center; padding:12px 18px; }
.pager{ display:flex; gap:4px; }
.pg-btn{ border:1px solid var(--line); background:var(--paper); border-radius:7px; width:27px; height:27px; font-size:12px; color:var(--ink-soft); }
.pg-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

/* ---------- filters ---------- */
.filter-toggle{ position:relative; }
.badge{ background:var(--navy); color:#fff; border-radius:999px; padding:0 6px; font-size:11px; font-weight:700; }
.filters-backdrop{ position:fixed; inset:0; background:rgba(16,24,40,.3); z-index:55; display:none; }
.filters-backdrop.show{ display:block; }
.filters-drawer{ position:fixed; top:0; right:0; bottom:0; width:320px; max-width:88vw; background:var(--paper);
  z-index:60; transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; box-shadow:var(--shadow-md); }
.filters-drawer.open{ transform:translateX(0); }
.filters-head{ display:flex; justify-content:space-between; padding:16px; border-bottom:1px solid var(--line); font-weight:700; }
.filters-body{ padding:14px 16px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px; }
.filters-foot{ display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line); }
.f-field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
.f-field input, .f-field select{ padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); font-weight:400; color:var(--ink); }
.f-field input:focus, .f-field select:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-50); }
.ms-box{ display:flex; flex-direction:column; gap:4px; max-height:140px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-sm); padding:7px; }
.ms-opt{ font-size:13px; color:var(--ink); display:flex; gap:6px; align-items:center; font-weight:400; }

/* ---------- modal ---------- */
.modal-backdrop{ position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:70; display:flex;
  align-items:center; justify-content:center; padding:20px; }
.modal-card{ background:var(--paper); border-radius:var(--radius); width:100%; max-width:560px;
  max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-md); }
.modal-head{ display:flex; justify-content:space-between; align-items:center; padding:18px; border-bottom:1px solid var(--line); }
.modal-head h3{ margin:0; font-size:16px; font-weight:700; }
.modal-body{ padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--line); }
.m-field{ display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--ink-soft); }
.m-field input, .m-field select, .m-field textarea{ padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm); font-weight:400; color:var(--ink); }
.m-field input:focus, .m-field select:focus, .m-field textarea:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-50); }
.m-check{ flex-direction:row; align-items:center; }

/* ---------- buttons ---------- */
.btn{ border-radius:var(--radius-sm); padding:9px 15px; border:1px solid var(--line); font-size:13px; font-weight:600; background:var(--paper); color:var(--ink); transition:filter .1s; }
.btn-primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
.btn-primary:hover{ background:var(--navy-dark); border-color:var(--navy-dark); }
.btn-ghost{ background:var(--paper); color:var(--ink); }
.btn-ghost:hover{ background:var(--bg); }
.btn-sm{ padding:6px 11px; font-size:12px; }

/* ---------- number inputs: no spinners, no wheel scroll surprises ---------- */
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
.no-spin{ appearance:textfield; -moz-appearance:textfield; }
.no-spin::-webkit-inner-spin-button, .no-spin::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }

/* ---------- presentational bits ---------- */
.pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--bg); color:var(--ink-soft); }
.pill-ok{ background:var(--ok-bg); color:var(--ok); }
.pill-bad{ background:var(--bad-bg); color:var(--bad); }
.pill-warn{ background:var(--warn-bg); color:var(--warn); }
.chip{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; margin-right:4px; font-weight:600;
  background:color-mix(in srgb, var(--chip-c) 16%, white); color:var(--chip-c); border:1px solid color-mix(in srgb, var(--chip-c) 45%, white); }
.barblock{ background:var(--line-soft); border-radius:6px; height:7px; overflow:hidden; width:100%; }
.barblock-fill{ height:100%; background:var(--ok); border-radius:6px; }
.barblock-warn{ background:var(--warn); }
.barblock-bad{ background:var(--bad); }
.spark{ width:120px; height:32px; color:var(--navy); }
.ring{ width:96px; height:96px; }
.ring-bg{ fill:none; stroke:var(--line); stroke-width:8; }
.ring-fg{ fill:none; stroke:var(--navy); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .3s; }
.ring-txt{ font-size:16px; font-weight:800; fill:var(--ink); }
.gauge-bg{ stroke:var(--line); stroke-width:10; }
.gauge-fg{ stroke:var(--navy); stroke-width:10; stroke-linecap:round; }
.gauge-tick{ stroke:var(--ink); stroke-width:2; }
.gauge-floor{ stroke:var(--bad); stroke-width:2; }
.gauge-txt{ font-size:15px; font-weight:800; fill:var(--ink); }
.gauge{ width:140px; height:98px; display:block; margin:4px auto 0; }
.donut{ width:100px; height:100px; }
.linechart{ width:100%; height:220px; }
.stackchart{ width:100%; height:220px; }

/* ---------- CSV/XLSX upload widget ---------- */
.upload-card{ border:1.5px dashed var(--navy-light); background:var(--navy-50); }
.upload-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:8px; }
.upload-btn{ cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.upload-input{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* ---------- dashboard ---------- */
.grid{ display:grid; gap:14px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
@media (max-width:900px){ .grid-4,.grid-3,.grid-2{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){ .grid-4,.grid-3,.grid-2{ grid-template-columns:1fr; } }
.stat-tile{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow); }
.stat-tile .v{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
.stat-tile .l{ color:var(--ink-soft); font-size:12px; font-weight:600; margin-bottom:5px; }
.stat-tile .d{ font-size:12px; margin-top:5px; font-weight:600; }
.d-up{ color:var(--ok); } .d-down{ color:var(--bad); }

/* ---------- kanban / phases ---------- */
.phase-board{ display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:10px; overflow-x:auto; }
.phase-col{ background:var(--bg); border-radius:12px; padding:10px; min-height:80px; }
.phase-col h4{ font-size:11.5px; margin:2px 4px 10px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
.phase-card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; font-size:12.5px; box-shadow:var(--shadow); cursor:pointer; }
.phase-card:hover{ box-shadow:var(--shadow-md); }
.phase-card b{ display:block; margin-bottom:3px; color:var(--navy-dark); }

/* ---------- toast ---------- */
.toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:11px 20px; border-radius:999px; font-size:13px; z-index:80; box-shadow:var(--shadow-md); font-weight:500; }

/* ---------- debt matrix heat ---------- */
.heat-cell{ text-align:center; border-radius:6px; padding:3px 6px; font-size:11px; font-weight:600; }
.dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); }

@media (max-width:600px){ .main{ padding:0 12px; } }

/* ============================================================
   Desktop: persistent sidebar (fintech-dashboard layout).
   CSS-only — reflows the same markup via grid-area, no JS change.
   Below this breakpoint the drawer stays an overlay (unchanged).
   ============================================================ */
@media (min-width:1024px){
  .shell{ display:grid; grid-template-columns:272px 1fr; grid-template-rows:var(--topbar-h) 1fr; grid-template-areas:"side top" "side main"; min-height:100vh; }
  .topbar{ grid-area:top; }
  .main{ grid-area:main; max-width:none; }
  .drawer{ grid-area:side; position:sticky; top:0; height:100vh; transform:none; box-shadow:none;
    border-right:1px solid var(--line); z-index:1; max-width:none; }
  .drawer-backdrop{ display:none !important; }
  .menu-btn, .drawer-close{ display:none; }
  .topbar-brand{ display:none; }
  .navtabs{ top:var(--topbar-h); }
}
</style>
