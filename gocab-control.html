<style>
/* ============================================================
   GoCab Control — design tokens
   Brand colors sampled directly from the GoCab logo:
   navy #34538c, olive #57611e. Everything else in this file is
   derived from those two plus a neutral fintech-dashboard scale.
   ============================================================ */
:root{
  --navy:#34538c; --navy-dark:#223a63; --navy-light:#5878b3; --navy-50:#eef1f8; --navy-100:#dde4f1;
  --olive:#57611e; --olive-dark:#414a16; --olive-50:#f1f2e6;

  --ink:#101828; --ink-soft:#667085; --ink-faint:#98a2b3;
  --paper:#ffffff; --bg:#f7f8fb;
  --line:#e4e7ec; --line-soft:#eef1f5;

  --ok:#17845a; --ok-bg:#e7f6ef;
  --bad:#c0352a; --bad-bg:#fbeae9;
  --warn:#a9660a; --warn-bg:#fbf1e1;

  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.05);
  --topbar-h:60px;

  /* kept for any stray reference — now points at the real primary brand color */
  --amber:var(--navy);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body{ font-feature-settings:"tnum" 1, "cv11" 1; }
button, input, select, textarea{ font-family:inherit; font-size:14px; }
button{ cursor:pointer; }
h1,h2,h3{ letter-spacing:-.01em; }

/* ---------- shell ---------- */
.shell{ min-height:100vh; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; gap:12px; padding:0 18px; height:var(--topbar-h); background:var(--paper);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; }
.icon-btn{ background:none; border:1px solid transparent; border-radius:var(--radius-sm); width:34px; height:34px;
  display:inline-flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-soft); }
.icon-btn:hover{ background:var(--bg); color:var(--ink); }
.avatar{ width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; margin-right:8px; flex:none; }
.topbar-brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{ display:block; height:26px; width:auto; }
.brand-word{ font-weight:800; letter-spacing:-.01em; font-size:16px; color:var(--navy-dark); }
.role-pill{ background:var(--navy-50); border:1px solid var(--navy-100); border-radius:999px; padding:5px 12px; font-size:12px;
  color:var(--navy-dark); font-weight:600; }
.lang-switch{ display:flex; gap:2px; background:var(--bg); border-radius:var(--radius-sm); padding:2px; border:1px solid var(--line); }
.lang-btn{ border:none; background:transparent; border-radius:7px; padding:5px 9px; font-size:12px; font-weight:600; color:var(--ink-soft); }
.lang-btn.active{ background:var(--navy); color:#fff; }
.spacer{ flex:1; }
.acct-wrap{ position:relative; }
.acct-toggle{ display:flex; align-items:center; }
.acct-menu{ display:none; position:absolute; right:0; top:42px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-md); min-width:230px; padding:6px; z-index:40; }
.acct-menu.open{ display:block; }
.acct-menu-label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:8px 10px 4px; }
.acct-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:9px 10px; border-radius:var(--radius-sm); font-size:13px; }
.acct-item:hover{ background:var(--bg); }
.acct-item.active{ background:var(--navy-50); color:var(--navy-dark); font-weight:700; }

.drawer-group-head{ width:100%; display:flex; justify-content:space-between; background:none; border:none;
  padding:14px 16px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; }
.drawer-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none;

.drawer-item.active{ background:var(--navy); color:#fff; font-weight:600; }
.drawer-item.active .di-icon{ opacity:1; }

.di-badge{ margin-left:auto; background:var(--bad); color:#fff; border-radius:999px; font-size:10.5px; font-weight:700; padding:1px 7px; }

/* ---------- navtabs ---------- */
.navtabs{ display:flex; gap:6px; padding:16px 0 10px; overflow-x:auto; position:sticky; top:var(--topbar-h); background:var(--bg); z-index:20; }
.navtab{ border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:7px 15px; white-space:nowrap;
  color:var(--ink-soft); font-weight:600; font-size:13px; }
.navtab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

/* ---------- page / cards ---------- */
.page{ padding-bottom:40px; perspective:1200px; }
.card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px; margin-bottom:16px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
.card-head h3{ margin:0; font-size:15px; font-weight:700; }
.card-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.muted{ color:var(--ink-soft); font-size:12.5px; }

.table-foot{ display:flex; justify-content:space-between; align-items:center; padding:12px 18px; }
.pager{ display:flex; gap:4px; }
.pg-btn{ border:1px solid var(--line); background:var(--paper); border-radius:7px; width:27px; height:27px; font-size:12px; color:var(--ink-soft); }
.pg-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

.filters-drawer{ position:fixed; top:0; right:0; bottom:0; width:320px; max-width:88vw; background:var(--paper);

.filters-head{ display:flex; justify-content:space-between; padding:16px; border-bottom:1px solid var(--line); font-weight:700; }
.filters-body{ padding:14px 16px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px; }
.filters-foot{ display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line); }
.f-field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
.f-field input, .f-field select{ padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); font-weight:400; color:var(--ink); }
.f-field input:focus, .f-field select:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-50); }
.ms-box{ display:flex; flex-direction:column; gap:4px; max-height:140px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-sm); padding:7px; }

/* ---------- buttons ---------- */
.btn{ border-radius:var(--radius-sm); padding:9px 15px; border:1px solid var(--line); font-size:13px; font-weight:600; background:var(--paper); color:var(--ink); transition:filter .1s; }

.grid-3{ grid-template-columns:repeat(3,1fr); }

.stat-tile .d{ font-size:12px; margin-top:5px; font-weight:600; }

.phase-col{ background:var(--bg); border-radius:12px; padding:10px; min-height:80px; }
.phase-col h4{ font-size:11.5px; margin:2px 4px 10px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
.phase-card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; font-size:12.5px; box-shadow:var(--shadow); cursor:pointer; }
.phase-card:hover{ box-shadow:var(--shadow-md); }
.phase-card b{ display:block; margin-bottom:3px; color:var(--navy-dark); }

/* ---- 01-utils.js ---- */
/* ===== 01. UTILS & FORMATTING ===== */
(function(global){
'use strict';

// --- Seeded PRNG (mulberry32) ---
function rng(seed){
  let a = seed >>> 0;
  return function(){
    a += 0x6D2B79F5;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function pick(rnd, arr){ return arr[Math.floor(rnd()*arr.length)]; }
function pickN(rnd, arr, n){
  const pool = arr.slice(); const out = [];
  n = Math.min(n, pool.length);
  for(let i=0;i<n;i++){ const idx = Math.floor(rnd()*pool.length); out.push(pool.splice(idx,1)[0]); }
  return out;
}
function randInt(rnd, min, max){ return Math.floor(rnd()*(max-min+1))+min; }
function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
function uid(prefix){ uid._n = (uid._n||0)+1; return prefix + '-' + uid._n; }

// --- Fixed reference date ---
const TODAY = new Date(2026, 8, 8); // 2026-09-08, months are 0-indexed
// Fixed "current instant" (date + time) the whole demo pretends it is right
// now — used for anything time-of-day sensitive (intake window, SLA
// countdowns, timers) so the app's behaviour is reproducible regardless of
// the real wall clock.
const NOW = new Date(2026, 8, 8, 14, 0, 0);

function shift(days){
  const d = new Date(TODAY.getTime());
  d.setDate(d.getDate() + days);
  return d;
}

const DOW = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_SHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

function pad2(n){ return String(n).padStart(2,'0'); }

function iso(d){
  if(!(d instanceof Date)) d = new Date(d);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function fmtD(d){
  if(!(d instanceof Date)) d = new Date(d);
  return pad2(d.getDate()) + '.' + pad2(d.getMonth()+1) + '.' + d.getFullYear();
}

function fmtDT(d){
  if(!(d instanceof Date)) d = new Date(d);
  return fmtD(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function fmtLong(d){
  if(!(d instanceof Date)) d = new Date(d);
  return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
}

function daysBetween(a,b){
  const ms = 24*3600*1000;
  const da = new Date(a.getFullYear? a.getFullYear():a);
  return Math.round((new Date(b) - new Date(a)) / ms);
}

// --- Money formatting: thin-space thousands, 2 decimals ---
function money(v){
  v = Number(v)||0;
  const sign = v < 0 ? '−' : '';
  const abs = Math.abs(v);
  const fixed = abs.toFixed(2);
  let [intPart, dec] = fixed.split('.');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return sign + intPart + '.' + dec;
}
function cur(v){ return money(v) + ' MAD'; }
function pctS(x){ return (x*100).toFixed(1).replace('.', ',') + '%'; }
function num(v){
  v = Number(v)||0;
  const sign = v<0?'−':'';
  const abs = Math.abs(Math.round(v));
  return sign + String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function esc(s){
  s = (s===undefined||s===null) ? '' : String(s);
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Plate formatting: 12345-A-6 ---
function fmtPlate(p){ return p; }

const Utils = {
  rng, pick, pickN, randInt, clamp, uid,
  TODAY, NOW, shift, iso, fmtD, fmtDT, fmtLong, daysBetween,
  money, cur, pctS, num, esc, fmtPlate,
  DOW, MON, MON_SHORT, pad2
};

global.GC = global.GC || {};
global.GC.Utils = Utils;

})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 04. CASH LEDGER & BALANCE RECONCILIATION =====
   Invariant: every driver balance is DERIVED from the cash ledger, never
   stored independently — recalcBalances() is the single source of truth. */
(function(global){
'use strict';
const U = global.GC.Utils, C = global.GC.CONST, E = global.GC.ENUM;
const { shift, iso, esc, uid } = U;

function mkCash(d, at, type, amt, iface, src, who, carry){
  return {
    id: uid('cash'),
    at: new Date(at.getTime ? at.getTime() : at),
    driver: d.fio, driverId: d.id, div: d.div,
    iface: iface, who: who || (iface==='Личный кабинет' ? d.fio : (iface==='Система по расписанию' ? 'Система' : 'Менеджер')),
    src: src, type: type, amt: Math.round(amt*100)/100,
    before: 0, after: 0,
    carry: !!carry // true only for the historical-debt carry-forward entry (module 05) —
                    // excluded from accrued/collected totals, it's not a day's rent or payment
  };
}

// Split `total` across `n` days within the last 30 days as natural-looking
// amounts that sum EXACTLY to total (random cut-point partition + rounding
// correction on the last slice so no cent is lost).
function distributeAcrossDays(rnd, total, n, dayFrom, dayTo){
  const days = [];
  const span = dayTo - dayFrom;
  const chosen = new Set();
  while(chosen.size < Math.min(n, span+1)){
    chosen.add(dayFrom + Math.floor(rnd()*(span+1)));
  }
  const dayList = Array.from(chosen).sort((a,b)=>a-b);
  const k = dayList.length;
  // random partition of [0,total] into k positive pieces
  const cuts = [0];
  for(let i=0;i<k-1;i++) cuts.push(rnd());
  cuts.push(1);
  cuts.sort((a,b)=>a-b);
  let amounts = [];
  for(let i=0;i<k;i++) amounts.push((cuts[i+1]-cuts[i])*total);
  // round to nearest 10, fix drift on the last entry
  amounts = amounts.map(a => Math.round(a/10)*10);
  const drift = total - amounts.reduce((s,a)=>s+a,0);
  amounts[amounts.length-1] += drift;
  return dayList.map((day,i)=>({ day, amt: amounts[i] }));
}

function paymentDaysFor(disc){
  if(disc >= 0.95) return 24;
  if(disc >= 0.88) return 18;
  if(disc >= 0.82) return 12;
  return 7;
}

const IFACE_POOL = ['Личный кабинет','Терминал','Менеджер'];

function buildCashLedgerBase(DB, rnd){
  DB.cash = DB.cash || [];
  const workingDrivers = DB.drivers.filter(d => d.car);

  workingDrivers.forEach(d => {
    // 1. daily rent accrual, last 30 days (today = day 0)
    for(let i=-29;i<=0;i++){
      DB.cash.push(mkCash(d, shift(i), 'Списание', d.rate, 'Система по расписанию', 'Баланс'));
    }
    // 2. payment target split across payment days
    const target = Math.round((d.rate*30*d._disc)/10)*10;
    const nDays = paymentDaysFor(d._disc);
    const splits = distributeAcrossDays(rnd, target, nDays, -29, 0);
    splits.forEach(s => {
      const iface = IFACE_POOL[Math.floor(rnd()*IFACE_POOL.length)];
      DB.cash.push(mkCash(d, shift(s.day), 'Пополнение', s.amt, iface, 'Баланс'));
    });
    // 3. Yandex balance carried as its own ledger source, single opening entry
    if(d.balY){
      DB.cash.push(mkCash(d, shift(-30), d.balY>=0?'Пополнение':'Списание', Math.abs(d.balY),
        'Система по расписанию', 'Баланс Яндекс', 'Система'));
    }
  });

  recalcBalances(DB);
}

// Push one "Перенос остатка" entry per driver carrying forward the closing
// balance produced by the 9-month collection model (module 09), then
// finalize every driver's bal to match it exactly.
function appendBalanceCarryForward(DB, closingBalanceByDriverId){
  DB.drivers.filter(d => d.car).forEach(d => {
    const modelClose = closingBalanceByDriverId[d.id];
    if(modelClose === undefined) return;
    const currentFromLedger = sumSrc(DB, d.id, 'Баланс');
    const delta = modelClose - currentFromLedger; // amount needed to reconcile to the model's number
    if(Math.round(delta*100) !== 0){
      DB.cash.push(mkCash(d, shift(-31), delta>=0?'Пополнение':'Списание', Math.abs(delta),
        'Система по расписанию', 'Баланс', 'Перенос остатка', true));
    }
  });
  recalcBalances(DB);
}

function sumSrc(DB, driverId, src){
  return DB.cash.filter(c => c.driverId===driverId && c.src===src)
    .reduce((s,c) => s + (c.type==='Пополнение' ? c.amt : -c.amt), 0);
}

// Recompute before/after on every operation in chronological order, and
// derive every driver's bal / balY / finesBal / dmgBal purely from the ledger.
function recalcBalances(DB){
  const sorted = DB.cash.slice().sort((a,b)=> new Date(a.at) - new Date(b.at));
  const running = {}; // key: driverId|src -> balance
  sorted.forEach(c => {
    const key = c.driverId+'|'+c.src;
    const before = running[key] || 0;
    const after = before + (c.type==='Пополнение' ? c.amt : -c.amt);
    c.before = Math.round(before*100)/100;
    c.after = Math.round(after*100)/100;
    running[key] = after;
  });
  DB.drivers.forEach(d => {
    d.bal = Math.round((running[d.id+'|Баланс']||0)*100)/100;
    d.balY = Math.round((running[d.id+'|Баланс Яндекс']||0)*100)/100;
    d.finesBal = Math.round((running[d.id+'|Баланс штрафов']||0)*100)/100;
    d.dmgBal = Math.round((running[d.id+'|Баланс повреждений']||0)*100)/100;
  });
}

function ledgerTotals(DB){
  const accrued = DB.cash.filter(c=>c.iface==='Система по расписанию' && c.type==='Списание' && c.src==='Баланс' && !c.carry)
    .reduce((s,c)=>s+c.amt,0);
  const collected = DB.cash.filter(c=>c.type==='Пополнение' && c.src==='Баланс' && !c.carry)
    .reduce((s,c)=>s+c.amt,0);
  return { accrued, collected, rate: accrued? collected/accrued : 0 };
}

global.GC.mkCash = mkCash;
global.GC.buildCashLedgerBase = buildCashLedgerBase;
global.GC.appendBalanceCarryForward = appendBalanceCarryForward;
global.GC.recalcBalances = recalcBalances;
global.GC.sumSrc = sumSrc;
global.GC.ledgerTotals = ledgerTotals;

/* ===== 05. NINE-MONTH COLLECTION MODEL & MANAGER KPI ===== */
(function(global){
'use strict';
const U = global.GC.Utils, C = global.GC.CONST;
const { clamp, randInt, pick } = U;

const MONTHS_9 = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь'];

// Runs the forward 8-month (Jan-Aug) bucket simulation per driver, then
// splices in September verbatim from the real cash ledger (module 04) so
// the last month always matches the cash-desk figures exactly.
function runCollectionModel(DB, rnd){
  const drivers = DB.drivers.filter(d => d.car);
  const perDriver = {};

  drivers.forEach(d => {
    let b = [0,0,0,0,0]; // Текущая, до30, 31-60, 61-90, от91
    let wo = 0, woN = 0;
    const monthly = [];

    for(let m=0; m<8; m++){
      b[4]+=b[3]; b[3]=b[2]; b[2]=b[1]; b[1]=b[0]; b[0]=0;
      const accrual = d.rate*30;
      b[0]+=accrual;

      let budget = Math.round(d.rate*30*clamp(d._disc + (rnd()-0.5)*0.06, 0.55, 1.05));
      let paid = 0;
      for(let i=4;i>=0 && budget>0;i--){
        const pay = Math.min(b[i], budget);
        b[i]-=pay; budget-=pay; paid+=pay;
      }
      if(rnd() < 0.16){
        let extra = d.rate * randInt(rnd,2,10);
        for(let i=4;i>=2 && extra>0;i--){
          const pay = Math.min(b[i], extra);
          b[i]-=pay; extra-=pay; paid+=pay;
        }
      }
      let wroteOff = false;
      if(b[4] > d.rate*3){
        if(rnd() < 0.62){
          wo += b[0]+b[1]+b[2]+b[3]+b[4];
          woN++;
          b = [0,0,0,0,0];
          wroteOff = true;
        }
      }
      monthly.push({ month: MONTHS_9[m], accrued: accrual, collected: paid,
        debtEnd: b.reduce((s,x)=>s+x,0), wroteOff });
    }

    // September: taken verbatim from the real ledger (already built)
    const accrual9 = DB.cash.filter(c=>c.driverId===d.id && c.src==='Баланс' &&
      c.iface==='Система по расписанию' && c.type==='Списание' && !c.carry).reduce((s,c)=>s+c.amt,0);
    const collected9 = DB.cash.filter(c=>c.driverId===d.id && c.src==='Баланс' &&
      c.type==='Пополнение' && !c.carry).reduce((s,c)=>s+c.amt,0);
    monthly.push({ month: MONTHS_9[8], accrued: accrual9, collected: collected9,
      debtEnd: b.reduce((s,x)=>s+x,0), wroteOff:false });

    perDriver[d.id] = {
      monthly, buckets: b.slice(), wo, woN,
      priorDebt: b.reduce((s,x)=>s+x,0) // debt as of end-August, carried into Sept ledger
    };
  });

  DB._collection = { perDriver, months: MONTHS_9 };
  return DB._collection;
}

// Uses the model's per-driver prior debt to finalize the cash ledger's
// carry-forward entry (see module 04 appendBalanceCarryForward).
function applyCollectionToLedger(DB){
  const model = DB._collection;
  const targets = {};
  DB.drivers.filter(d=>d.car).forEach(d=>{
    const current = global.GC.sumSrc(DB, d.id, 'Баланс');
    const priorDebt = model.perDriver[d.id] ? model.perDriver[d.id].priorDebt : 0;
    targets[d.id] = current - priorDebt;
  });
  global.GC.appendBalanceCarryForward(DB, targets);
}

// --- Manager KPI (§8.2) ---
const KPI_METRICS = [
  { key:'collection', name:'Собираемость аренды', weight:0.30, plan:0.96, floor:0.90, inverted:false },
  { key:'utilization', name:'Утилизация автопарка', weight:0.25, plan:0.92, floor:0.85, inverted:false },
  { key:'idle',        name:'Простой автопарка',    weight:0.15, plan:0.08, floor:0.12, inverted:true  },
  { key:'fines',       name:'Собираемость штрафов', weight:0.15, plan:0.90, floor:0.80, inverted:false },
  { key:'baddebt',     name:'Долги уволенных водителей', weight:0.15, plan:0.015, floor:0.03, inverted:true }
];

function achievement(metric, fact){
  const { plan, floor, inverted } = metric;
  if(inverted) return fact > floor ? 0 : clamp(plan/Math.max(fact,1e-6), 0, 1);
  return fact < floor ? 0 : clamp(fact/plan, 0, 1);
}

function computeManagerKPI(DB){
  const managers = {}; // name -> {divs[], drivers[], cars[]}
  DB.divs.forEach(dv => {
    managers[dv.manager] = managers[dv.manager] || { name: dv.manager, divs:[], drivers:[], cars:[] };
    managers[dv.manager].divs.push(dv.id);
  });
  DB.drivers.forEach(d => { const m = Object.values(managers).find(m=>m.divs.includes(d.div)); if(m) m.drivers.push(d); });
  DB.cars.forEach(c => { const m = Object.values(managers).find(m=>m.divs.includes(c.div)); if(m) m.cars.push(c); });

  const model = DB._collection;
  const result = [];
  Object.values(managers).forEach(m => {
    const driverIds = m.drivers.map(d=>d.id);
    let accruedSum=0, collectedSum=0, wo=0, woN=0;
    const sparkline = MONTHS_9.map(()=>({accrued:0, collected:0}));
    driverIds.forEach(id => {
      const dm = model.perDriver[id]; if(!dm) return;
      wo += dm.wo; woN += dm.woN;
      dm.monthly.forEach((mm,i) => { sparkline[i].accrued += mm.accrued; sparkline[i].collected += mm.collected; });
    });
    sparkline.forEach(s => { accruedSum += s.accrued; collectedSum += s.collected; });
    const collectionFact = accruedSum ? collectedSum/accruedSum : 0;
    const collectionSpark = sparkline.map(s => s.accrued ? s.collected/s.accrued : 0);

    const carsN = m.cars.length || 1;
    const workingCars = m.cars.filter(c=>c.status==='В работе').length;
    const utilFact = workingCars / carsN;
    const idleFact = 1 - utilFact;

    const divFines = DB.fines ? DB.fines.filter(f => m.divs.includes(f.div)) : [];
    const finesTotal = divFines.reduce((s,f)=>s+f.sum,0);
    const finesPaid = divFines.filter(f=>f.status==='Оплачен').reduce((s,f)=>s+f.sum,0);
    const finesFact = finesTotal ? finesPaid/finesTotal : 1;

    const badDebt = Math.max(0, wo - C.DEP_TARGET*woN) * 0.35;
    const baddebtFact = collectedSum ? badDebt/collectedSum : 0;

    const facts = { collection:collectionFact, utilization:utilFact, idle:idleFact, fines:finesFact, baddebt:baddebtFact };
    let bonus = 0;
    const chips = [];
    // Stop factor uses CURRENT outstanding debt (today's driver balances),
    // not the cumulative 9-month accrued/collected gap — the two are on
    // different scales and comparing the latter to a per-day threshold
    // would trip on almost any dataset.
    const currentDebt = m.drivers.reduce((s,d)=> s + Math.max(0, -d.bal), 0);
    const debtPerVehicle = carsN ? currentDebt/carsN : 0;
    const debtStop = debtPerVehicle > C.RATE*C.DEBT_LIMIT_DAYS;
    if(debtStop) chips.push('Долг на автомобиль выше нормы — бонус за собираемость обнулён');

    KPI_METRICS.forEach(metric => {
      const fact = facts[metric.key];
      const ach = (metric.key==='collection' && debtStop) ? 0 : achievement(metric, fact);
      bonus += C.BONUS * metric.weight * ach;
    });
    const nonReturnPenalty = 0; // no non-returned-vehicle events in demo data
    const payout = C.FIX_PAY + bonus - nonReturnPenalty;
    const avgAchievement = KPI_METRICS.reduce((s,metric)=>s+achievement(metric, facts[metric.key]),0)/KPI_METRICS.length;

    result.push({
      name: m.name, divs: m.divs, facts, sparklines: { collection: collectionSpark },
      bonus, payout, avgAchievement, chips, wo, woN,
      driverCount: driverIds.length, carCount: carsN
    });
  });
  return result;
}

global.GC.KPI_METRICS = KPI_METRICS;
global.GC.kpiAchievement = achievement;
global.GC.computeManagerKPI = computeManagerKPI;

// Booking slots: 10:00-18:00 every 30 min, lunch 12:00-13:00 closed
function daySlots(){
  const out = [];
  for(let h=10; h<18; h++){
    for(const mm of [0,30]){
      if(h===12) continue; // lunch closed
      out.push(U.pad2(h)+':'+U.pad2(mm));
    }
  }
  return out;
}
const SLOT_CYCLE_MIN = 40; // scheduled-service cycle: 35 work + 5 handover

// Intake window: phase 0 -> 1 only from 30 min before the booked slot to
// 60 min after it. `slotAt` is a Date built from slotDay+slot.
function intakeWindow(slotAt){
  return { from: new Date(slotAt.getTime() - 30*60000), to: new Date(slotAt.getTime() + 60*60000) };
}
function slotToDate(slotDay, slot){
  const [h,m] = slot.split(':').map(Number);
  const d = new Date(slotDay.getTime ? slotDay.getTime() : new Date(slotDay).getTime());
  d.setHours(h,m,0,0);
  return d;
}
function canStartIntake(order, now){
  now = now || NOW;
  const slotAt = slotToDate(new Date(order.slotDay), order.slot);
  const w = intakeWindow(slotAt);
  return now >= w.from && now <= w.to;
}
function intakeWindowLabel(order){
  const slotAt = slotToDate(new Date(order.slotDay), order.slot);
  const w = intakeWindow(slotAt);
  return U.fmtDT(w.from) + '–' + U.fmtDT(w.to);
}

// Advance a repair order one phase forward, enforcing the gates from §7.
function canAdvance(order){
  switch(order.phase){
    case 0: return canStartIntake(order) ? {ok:true} : {ok:false, reason:'Приёмка доступна только в окно '+intakeWindowLabel(order)};
    case 1: return (order.fuel!=null && order.fuelPhoto) ? {ok:true} : {ok:false, reason:'Укажите уровень топлива и фото бака'};
    case 2: return (order.works.length>0 && order.mech && order.post) ? {ok:true} : {ok:false, reason:'Нужна минимум одна работа, механик и пост'};
    case 3: return order.parts.every(p=>p.issued) ? {ok:true} : {ok:false, reason:'Не все запчасти выданы под подпись'};

/* ---- 08-debt-matrix.js ---- */
/* ===== 08. DEBT MATRIX BY DAY (§8.3) =====
   Driver x day grid. Reconstructed from the cash ledger's own chronological
   before/after (already exact — see module 04), which is equivalent to the
   spec's "undo the day's operations, add back rent, subtract earnings"
   approach but avoids re-deriving numbers that are already ground truth.
   Today's column is therefore guaranteed to equal the driver's ledger
   balance shown in "Водители". */
(function(global){
'use strict';
const U = global.GC.Utils;
const { iso, shift } = U;

function debtMatrix(DB, days){
  days = days || 30;
  const wd = global.GC.workingDrivers(DB);
  const byDriverDay = {}; // driverId -> { 'YYYY-MM-DD': afterBalance }
  wd.forEach(d => byDriverDay[d.id] = {});

  const sorted = DB.cash.filter(c=>c.src==='Баланс').slice().sort((a,b)=> new Date(a.at)-new Date(b.at));
  sorted.forEach(c => {
    if(!byDriverDay[c.driverId]) return;
    byDriverDay[c.driverId][iso(new Date(c.at))] = c.after;
  });

  const dayList = [];
  for(let i=-(days-1); i<=0; i++) dayList.push(iso(shift(i)));

  return wd.map(d => {
    let carry = 0;
    const cells = dayList.map(day => {
      if(byDriverDay[d.id][day] !== undefined) carry = byDriverDay[d.id][day];
      return { day, balance: Math.round(carry*100)/100 };
    });
    return { driverId: d.id, driver: d.fio, div: d.div, cells };
  });
}

function agingBucket(negDays){
  if(negDays <= 0) return null;
  if(negDays <= 7) return '1–7';
  if(negDays <= 14) return '8–14';
  if(negDays <= 29) return '15–29';
  return '30+';
}

// For a driver row, how many consecutive days (ending today) has the
// balance stayed negative.
function daysInDebt(cells){
  let n = 0;
  for(let i=cells.length-1; i>=0; i--){
    if(cells[i].balance < 0) n++; else break;
  }
  return n;
}

global.GC.debtMatrix = debtMatrix;
global.GC.agingBucket = agingBucket;
global.GC.daysInDebt = daysInDebt;

})(typeof window !== 'undefined' ? window : globalThis);

// external randomness source stored, so it's safe to call repeatedly.

  (DB._dispatch||[]).forEach(p => {

    p.lat += Math.cos(rad)*0.0006;

function notificationCount(){
  const DB = S.DB;
  let n = 0;
  const in30 = (d) => { const days = U.daysBetween(U.NOW, new Date(d)); return days>=0 && days<=30; };
  DB.drivers.forEach(d => { if(d.licUntil && in30(d.licUntil)) n++; });
  DB.cars.forEach(c => { if(in30(c.insUntil)) n++; if(in30(c.techUntil)) n++; });
  DB.leases.forEach(l => { if(in30(l.next)) n++; });
  DB.fines.forEach(f => { if(f.status==='Не оплачен' && f.sum>1000) n++; });
  return n;
}

function drawerHTML(){
  let html = '<div class="drawer-backdrop'+(S.side?' show':'')+'" data-act="close-drawer"></div>';
  html += '<nav class="drawer'+(S.side?' open':'')+'" id="nav">';
  html += '<div class="drawer-head">'
    + '<div class="drawer-brand"><img class="brand-mark" src="'+LOGO_MARK_SRC+'" alt="GoCab" width="30" height="32"><span class="brand-word">GoCab</span></div>'
    + '<button class="icon-btn drawer-close" data-act="close-drawer">✕</button></div>';
  MENU.forEach(g => {
    const items = g.items.filter(it => G.canSeeSection(it.key));
    if(!items.length) return;
    const open = S.menuOpen[g.group] !== false;
    html += '<div class="drawer-group">';
    html += '<button class="drawer-group-head" data-act="toggle-group" data-group="'+esc(g.group)+'">'
      + '<span>'+esc(g.group)+'</span><span class="chev">'+(open?'▾':'▸')+'</span></button>';
    html += '<div class="drawer-group-body" style="display:'+(open?'block':'none')+'">';
    items.forEach(it => {
      const activeItem = S.sec===it.key && (it.tab===undefined || S.tab===it.tab);
      html += '<button class="drawer-item'+(activeItem?' active':'')+'" data-act="goto" data-sec="'+esc(it.key)+'" data-tab="'+(it.tab||0)+'">'
        + '<span class="di-icon">'+it.icon+'</span><span>'+esc(it.label)+'</span>'
        + (it.key==='notif' ? notifBadge() : '')
        + '</button>';
    });
    html += '</div></div>';
  });
  html += '</nav>';
  return html;
}
function notifBadge(){
  const n = notificationCount();
  return n>0 ? '<span class="di-badge">'+n+'</span>' : '';
}

function navtabsHTML(){

  ).join('') + '</div>';
}

function pageHTML(){
  const fn = G.VIEWS[S.sec];
  let inner;
  try{
    inner = fn ? fn(S.tab) : '<div class="card"><div class="empty-state">Раздел в разработке</div></div>';
  } catch(e){
    inner = '<div class="card"><div class="empty-state">Ошибка отображения: '+esc(e.message)+'</div></div>';
  }
  return '<div class="page" id="page">'+inner+'</div>';
}

let lastRevealKey = '';
function render(){
  if(!G.canSeeSection(S.sec)){
    const sections = G.ROLE_SECTIONS[S.role]||['dash'];
    S.sec = sections[0]; S.tab = 0;
  }
  const root = document.getElementById('app');
  if(!root) return;
  root.innerHTML = '<div class="shell">'
    + topbarHTML()
    + drawerHTML()
    + '<main class="main">'
    + navtabsHTML()
    + pageHTML()
    + '</main>'
    + '</div>'
    + (S.modal ? G.modalHTML() : '')
    + (S.toastMsg ? '<div class="toast show" id="toast">'+esc(S.toastMsg)+'</div>' : '');

  const key = [S.side,S.sec,S.tab,S.role,S.lang].join('|');
  const page = document.getElementById('page');
  if(page && !global.matchMedia('(prefers-reduced-motion: reduce)').matches){
    if(key !== lastRevealKey){
      Array.from(page.children).forEach((child,i) => {
        child.classList.add('reveal');
        child.style.animationDelay = (i*55)+'ms';
      });
    }
  }
  lastRevealKey = key;

  if(S.lang !== 'ru' && G.applyI18n) G.applyI18n();
}

  const a = document.createElement('a');
  a.href = url; a.download = kind + '-' + U.iso(U.NOW) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  G.toast('Файл выгружен: '+a.download);
}

function viewDash(){

  html += statTile('Водители', DB.drivers.filter(d=>d.active).length+' активных', DB.drivers.length+' всего', 'up');
  html += statTile('Собираемость аренды', totals.accrued ? pctS(totals.rate) : 'нет данных', 'план 96%', totals.rate>=0.9?'up':'down');
  html += statTile('KPI менеджеров', DB._kpi.length ? pctS(kpiAvg) : 'нет данных', 'среднее достижение', kpiAvg>=0.8?'up':'down');
  html += '</div>';

  html += '<div class="grid grid-3">';

  html += statTile('Ремонты в работе', openRepairs+' наряд-заказов', (DB.orders2.length-openRepairs)+' завершено', 'up');
  html += statTile('Уведомления', notifN, 'требуют внимания', notifN>5?'down':'up');
  html += '</div>';

  if(DB.realImport && (DB.realImport.drivers || DB.realImport.vehicles)){
    const fs = DB.realImport.drivers ? G.computeFinancialSituation(DB.realImport.drivers) : null;
    const vs = DB.realImport.vehicles ? G.computeVehicleStatusBreakdown(DB.realImport.vehicles) : null;
    html += '<div class="card"><div class="card-head"><h3>Реальные данные (импорт)</h3>'
      + '<button class="btn btn-sm btn-ghost" data-act="goto" data-sec="import" data-tab="0">К деталям →</button></div>'
      + '<div class="grid grid-4">'
      + (fs ? statTile('Реальный баланс водителей', cur(fs.totalBalance), fs.count+' водителей', fs.totalBalance>=0?'up':'down') : '')
      + (fs ? statTile('Водителей с долгом', fs.inDebtCount, 'из '+fs.count, 'down') : '')
      + (vs ? statTile('Автопарк в работе', pctS(vs.utilization), vs.total+' машин', vs.utilization>=0.8?'up':'down') : '')
      + (vs ? statTile('Без водителя', vs.withoutDriver, 'машин простаивает', vs.withoutDriver>0?'down':'up') : '')
      + '</div></div>';
  }

  if(Object.keys(DB._collection.perDriver).length){
    html += '<div class="card"><div class="card-head"><h3>Собираемость аренды по месяцам</h3></div>';
    const spark9 = DB._collection.months.map((m,i)=>{
      let acc=0, col=0;
      Object.values(DB._collection.perDriver).forEach(p=>{ acc+=p.monthly[i].accrued; col+=p.monthly[i].collected; });
      return acc? col/acc : 0;
    });
    html += G.lineChartMulti([{name:'Собираемость', color:'#34538c', values: spark9.map(x=>x*100)}], 700, 200);
    html += '<div class="muted">'+DB._collection.months.join(' · ')+'</div></div>';
  }

  html += '<div class="card"><div class="card-head"><h3>Автопарк по филиалам</h3></div><div class="grid grid-3">';
  DB.divs.forEach(dv => {
    const cars = DB.cars.filter(c=>c.div===dv.id);

    html += '<div class="stat-tile"><div class="l">'+esc(dv.name)+'</div><div class="v">'+work+'/'+cars.length+'</div>'
      + G.barBlock(cars.length? work/cars.length*100:0) + '</div>';
  });
  html += '</div></div>';
  return html;
}

    + '<div class="d '+(dir==='up'?'d-up':'d-down')+'">'+(dir==='up'?'▲':'▼')+' '+esc(sub)+'</div></div>';

function viewCash(){
  const DB = S.DB;
  const defs = [
    { key:'src', label:'Источник', type:'sel', options:E.SOURCES },
    { key:'type', label:'Тип', type:'sel', options:E.OPTYPES },
    { key:'iface', label:'Интерфейс', type:'sel', options:E.IFACES },
    { key:'driver', label:'Водитель', type:'text' }
  ];
  const sorted = DB.cash.slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  const filtered = G.applyFilters('cash', sorted, defs);
  const totals = G.ledgerTotals(DB);

  // Full-picture dashboard: credit/debit totals over whatever is currently
  // filtered (so narrowing by source/interface/driver updates the summary
  // too), plus a breakdown by balance source.
  const credit = filtered.filter(c=>c.type==='Пополнение').reduce((s,c)=>s+c.amt,0);
  const debit = filtered.filter(c=>c.type==='Списание').reduce((s,c)=>s+c.amt,0);
  const creditN = filtered.filter(c=>c.type==='Пополнение').length;
  const debitN = filtered.filter(c=>c.type==='Списание').length;
  const net = credit - debit;

  let html = '<h3 style="margin:0 0 10px">Касса — общая картина'+(filtered.length!==sorted.length?' <span class="muted">(по текущему фильтру)</span>':'')+'</h3>'
    + '<div class="grid grid-4">'
    + statTile('Пополнения', cur(credit), creditN+' операций', 'up')
    + statTile('Списания', cur(debit), debitN+' операций', 'down')
    + statTile('Чистое изменение', cur(net), net>=0?'больше пополнений':'больше списаний', net>=0?'up':'down')
    + statTile('Всего операций', filtered.length, '')
    + '</div>';
  const bySrc = E.SOURCES.map(src => {
    const rows = filtered.filter(c=>c.src===src);
    const cr = rows.filter(c=>c.type==='Пополнение').reduce((s,c)=>s+c.amt,0);
    const db = rows.filter(c=>c.type==='Списание').reduce((s,c)=>s+c.amt,0);
    return { src, credit:cr, debit:db, net:cr-db, n:rows.length };
  }).filter(r=>r.n>0);
  if(bySrc.length){
    html += G.tableHTML([
      { label:'Источник', key:'src' }, { label:'Пополнения', render:r=>cur(r.credit) },
      { label:'Списания', render:r=>cur(r.debit) },
      { label:'Нетто', render:r=>'<span style="color:'+(r.net>=0?'var(--ok)':'var(--bad)')+'">'+cur(r.net)+'</span>' },
      { label:'Операций', key:'n' }
    ], bySrc, { title:'По источникам' });
  }

  html += '<div class="grid grid-3">'
    + statTile('Начислено (30 дн.)', cur(totals.accrued),'')
    + statTile('Собрано (30 дн.)', cur(totals.collected),'')
    + statTile('Собираемость', pctS(totals.rate),'')
    + '</div>';
  html += '<div class="card-head"><div></div><div class="card-actions">'+G.filtersHTML('cash', defs)
    + '<button class="btn btn-sm btn-primary" data-act="add-cash-op">+ Операция</button></div></div>';
  const cols = [
    { label:'Дата', render:c=>fmtDT(c.at) }, { label:'Водитель', key:'driver' },
    { label:'Интерфейс', key:'iface' }, { label:'Источник', key:'src' },
    { label:'Тип', render:c=>G.statusPill(c.type, c.type==='Пополнение'?'ok':'bad') },
    { label:'Сумма', render:c=>cur(c.amt) }, { label:'Было', render:c=>cur(c.before) }, { label:'Стало', render:c=>cur(c.after) }
  ];
  html += G.tableHTML(cols, filtered, { title:'Касса ('+filtered.length+')', page:page('cash'), pageKey:'cash' });
  return html;
}

(function(global){

/* ============== STATS ============== */
function viewStats(tab){
  if(tab===1) return viewStatsDivisions();

function viewStatsSummary(){
  const DB = S.DB;
  const totals = G.ledgerTotals(DB);
  const kpiAvg = DB._kpi.reduce((s,m)=>s+m.avgAchievement,0)/(DB._kpi.length||1);
  const work = DB.cars.filter(c=>c.status==='В работе').length;
  let html = '<div class="grid grid-4">'
    + H.statTile('Собираемость аренды', pctS(totals.rate),'')
    + H.statTile('Утилизация парка', pctS(work/DB.cars.length),'')
    + H.statTile('KPI менеджеров', pctS(kpiAvg),'')

    + '</div>';

  const spark = DB._collection.months.map((m,i)=>{
    let acc=0,col=0; Object.values(DB._collection.perDriver).forEach(p=>{acc+=p.monthly[i].accrued;col+=p.monthly[i].collected;});
    return acc?col/acc*100:0;
  });
  html += G.lineChartMulti([{name:'Собираемость',color:'#34538c',values:spark}],700,200);
  html += '</div>';
  return html;
}
function viewStatsDivisions(){
  const DB = S.DB;
  const rows = DB.divs.map(dv => {
    const cars = DB.cars.filter(c=>c.div===dv.id);
    const drivers = DB.drivers.filter(d=>d.div===dv.id && d.car);
    const work = cars.filter(c=>c.status==='В работе').length;
    const accrued = drivers.reduce((s,d)=> s + G.sumSrc(DB,d.id,'Баланс')*0,0); // placeholder not used
    const totals = drivers.reduce((acc,d)=>{
      const rentOps = DB.cash.filter(c=>c.driverId===d.id && c.src==='Баланс' && !c.carry);
      acc.accrued += rentOps.filter(c=>c.type==='Списание').reduce((s,c)=>s+c.amt,0);
      acc.collected += rentOps.filter(c=>c.type==='Пополнение').reduce((s,c)=>s+c.amt,0);
      return acc;
    }, {accrued:0, collected:0});
    return { name: dv.name, manager: dv.manager, cars: cars.length, work, drivers: drivers.length,
      rate: totals.accrued ? totals.collected/totals.accrued : 0 };
  });
  const cols = [
    { label:'Филиал', key:'name' }, { label:'Менеджер', key:'manager' },
    { label:'Автомобили', render:r=>r.work+'/'+r.cars }, { label:'Водители', key:'drivers' },
    { label:'Собираемость', render:r=>pctS(r.rate) }
  ];
  return G.tableHTML(cols, rows, { title:'Подразделения' });
}
function viewDebtMatrix(){
  const DB = S.DB;
  const matrix = G.debtMatrix(DB, 14); // last 14 days fits the page width comfortably
  const days = matrix[0] ? matrix[0].cells.map(c=>c.day.slice(5)) : [];
  let html = '<div class="card-head"><h3>Задолженность по дням</h3><div class="muted">Столбец «сегодня» равен балансу в разделе «Водители»</div></div>';
  html += '<div class="table-scroll"><table class="tbl"><thead><tr><th>Водитель</th><th>Бакет</th>'
    + days.map(d=>'<th>'+d+'</th>').join('') + '<th>Меры</th></tr></thead><tbody>';
  matrix.forEach(row => {
    const debtDays = G.daysInDebt(row.cells);
    const bucket = G.agingBucket(debtDays) || '—';
    html += '<tr><td><b>'+esc(row.driver)+'</b></td><td>'+bucket+'</td>';
    row.cells.forEach(c => {
      const neg = c.balance < 0;
      const depth = Math.min(1, Math.abs(c.balance)/2000);
      const bg = neg ? 'rgba(214,69,69,'+ (0.12+depth*0.55).toFixed(2) +')' : 'transparent';
      html += '<td class="heat-cell" style="background:'+bg+'">'+ (neg ? U.num(c.balance) : '<span class="dot"></span>') + '</td>';
    });
    html += '<td><button class="btn btn-sm btn-ghost" data-act="debt-measure" data-id="'+row.driverId+'">Меры</button></td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}
function viewCollection(){

function viewTrafficLight(){

/* ============== DISPATCH ============== */
function viewDispatch(){
  const DB = S.DB;
  const pts = DB._dispatch;
  const box = { latMin:33.4, latMax:34.1, lngMin:-7.7, lngMax:-6.7 };
  const w=700,h=340;
  const toXY = (p) => {
    const x = (p.lng-box.lngMin)/(box.lngMax-box.lngMin)*w;
    const y = h - (p.lat-box.latMin)/(box.latMax-box.latMin)*h;
    return [x,y];
  };
  let svg = '<svg viewBox="0 0 '+w+' '+h+'" class="linechart" style="height:340px;background:#f7f4ec;border-radius:8px">';
  pts.forEach(p => {
    const [x,y] = toXY(p);
    const color = p.status==='На линии' ? '#2e9e5b' : '#c9891c';
    svg += '<circle cx="'+x+'" cy="'+y+'" r="6" fill="'+color+'" stroke="#fff" stroke-width="1.5"/>';
  });
  svg += '</svg>';
  let html = '<div class="card"><div class="card-head"><h3>Диспетчерская карта</h3>'
    + '<div class="muted">Синтетические координаты — точка интеграции с реальным GPS-провайдером: DISP.feed()</div></div>' + svg + '</div>';
  const cols = [
    { label:'Водитель', key:'driver' }, { label:'Авто', key:'car' }, { label:'Город', key:'city' },
    { label:'Статус', render:p=>G.statusPill(p.status) }, { label:'Скорость', render:p=>p.speed+' км/ч' }
  ];
  html += G.tableHTML(cols, pts, { title:'Список' });
  return html;
}

/* ============== TASKS ============== */
function viewTasks(){
  const DB = S.DB;
  const role = S.role;
  const tasks = [];
  if(['Приёмщик на ремонт','Кантри-менеджер','Менеджер парка'].includes(role)){
    DB.orders2.filter(o=>o.phase===0).forEach(o => tasks.push({ sec:'repairs', title:'Приёмка '+o.no, sub: o.car+' · окно '+G.intakeWindowLabel(o), prio: o.demoOpen?'Критично':'Обычный' }));
  }
  if(['Механик','Кантри-менеджер','Менеджер парка'].includes(role)){
    DB.orders2.filter(o=>o.phase===2||o.phase===4).forEach(o => tasks.push({ sec:'repairs', title:'Работы по '+o.no, sub: o.reason, prio:o.prio }));
  }
  if(['Кладовщик','Кантри-менеджер','Менеджер парка'].includes(role)){
    DB.orders2.filter(o=>o.phase===3).forEach(o => tasks.push({ sec:'repairs', title:'Выдать запчасти '+o.no, sub: o.parts.map(p=>p.name).join(', '), prio:'Обычный' }));
  }
  DB.tickets.filter(t=>t.status!=='Решено').slice(0,5).forEach(t => tasks.push({ sec:'tickets', title:'Обращение: '+t.theme, sub:t.driver, prio:'Обычный' }));
  const cols = [
    { label:'Задача', key:'title' }, { label:'Детали', key:'sub' },
    { label:'Приоритет', render:r=>G.statusPill(r.prio, r.prio==='Критично'?'bad':(r.prio==='Высокий'?'warn':'ok')) },
    { label:'', render:r=>'<button class="btn btn-sm btn-ghost" data-act="goto" data-sec="'+r.sec+'" data-tab="0">Перейти</button>' }
  ];
  return G.tableHTML(cols, tasks, { title:'Мои задачи ('+tasks.length+')' });
}

/* ============== NOTIFICATIONS ============== */
function buildNotifRows(){
  const DB = S.DB;
  const rows = [];
  const in30 = (d) => daysBetween(NOW, new Date(d)) <= 30;
  DB.drivers.forEach(d => { if(d.licUntil && in30(d.licUntil)) rows.push({ kind:'Документы', obj:d.fio, msg:'Срок прав истекает', date:d.licUntil }); });
  DB.cars.forEach(c => {
    if(in30(c.insUntil)) rows.push({ kind:'Документы', obj:c.plate, msg:'Страховка истекает', date:c.insUntil });
    if(in30(c.techUntil)) rows.push({ kind:'Документы', obj:c.plate, msg:'Техосмотр истекает', date:c.techUntil });
  });
  DB.leases.forEach(l => { if(in30(l.next)) rows.push({ kind:'Финансы', obj:l.car, msg:'Платёж по лизингу', date:l.next }); });
  DB.fines.forEach(f => { if(f.status==='Не оплачен' && f.sum>1000) rows.push({ kind:'Финансы', obj:f.driver, msg:'Неоплаченный штраф '+cur(f.sum), date:f.violAt }); });
  return rows;
}
function viewNotif(tab){
  const rows = buildNotifRows();
  const filtered = tab===1 ? rows.filter(r=>r.kind==='Документы') : (tab===2 ? rows.filter(r=>r.kind==='Финансы') : rows);
  const cols = [
    { label:'Категория', key:'kind' }, { label:'Объект', key:'obj' }, { label:'Сообщение', key:'msg' }, { label:'Дата', render:r=>fmtD(r.date) }
  ];
  return G.tableHTML(cols, filtered.sort((a,b)=>new Date(a.date)-new Date(b.date)), { title:'Уведомления ('+filtered.length+')' });
}

function sectionGroups(){

  }));

function openRightsEditor(userId){
  const u = S.DB.users.find(x=>x.id===userId);
  if(!u) return;
  const groups = sectionGroups();
  const currentSections = G.ROLE_SECTIONS[u.appRole] || [];
  let body = '<div class="muted">Изменение прав пользователя <b>'+esc(u.name)+'</b> (роль доступа: '+esc(u.appRole)+').</div>';

    + '<div class="pill pill-warn" style="display:inline-block;margin-left:8px">Изменения применятся ко всем сотрудникам с этой ролью</div></div>';
  Object.keys(groups).forEach(g => {
    body += '<div class="muted" style="margin-top:6px">'+esc(g)+'</div>';
    groups[g].forEach(key => {
      const label = G.SECTION_LABEL[key] || key;
      const checked = currentSections.includes(key);
      const isDash = key==='dash';
      body += '<label class="m-field m-check"><input type="checkbox" data-section="'+esc(key)+'" '+(checked?'checked':'')+' '+(isDash?'disabled':'')+'> '
        + esc(label) + (isDash?' <span class="muted">(всегда включён)</span>':'') + '</label>';
    });
  });

  G.openModal({
    title: 'Изменить права', body,
    saveLabel:'Сохранить',
    onSave: () => {
      const modalEl = document.querySelector('.modal-card');
      if(!modalEl) return;
      const rights = Array.from(modalEl.querySelectorAll('[data-right]:checked')).map(el=>el.dataset.right);
      const sections = Array.from(modalEl.querySelectorAll('[data-section]:checked')).map(el=>el.dataset.section);
      if(!sections.includes('dash')) sections.push('dash');
      if(sections.length===0){ G.toast('Нельзя сохранить пустой список разделов'); return; }
      u.rights = rights.length ? rights : ['Водители'];
      G.ROLE_SECTIONS[u.appRole] = sections;
      G.toast('Права сохранены для роли «'+u.appRole+'»');
      G.closeModal();
    }
  });
}

/* ---- 19-app-init.js ---- */
/* ===== 19. CLICK DELEGATION & BOOTSTRAP =====
   One delegated listener per concern, matching on data-* attributes.
   Two traps from section 10 of the spec, both handled here:
   1) A capture-phase guard stops clicks on SELECT/INPUT/TEXTAREA from
      reaching the document-level click handler, so preventDefault() in a
      handler never blocks a native dropdown/input from opening.
   2) The account-menu / drawer "click outside to close" check also runs in
      capture phase, because the main handler re-renders (and detaches the
      clicked node) before the bubble phase would otherwise reach it. */
(function(global){
'use strict';
const G = global.GC, S = G.S, U = G.Utils;

function el(sel){ return document.querySelector(sel); }

function toggleGroup(group){
  S.menuOpen[group] = (S.menuOpen[group] === false) ? true : false;
}

Object.assign(G.ACTIONS, {
  'toggle-drawer': () => { S.side = !S.side; },
  'close-drawer': () => { S.side = false; },
  'toggle-group': (t) => toggleGroup(t.dataset.group),
  'goto': (t) => { S.sec = t.dataset.sec; S.tab = Number(t.dataset.tab||0); S.side = false; S._filtersOpen = null; },
  'set-tab': (t) => { S.tab = Number(t.dataset.tab); },
  'set-role': (t) => {
    S.role = t.dataset.role;
    const u = G.DB_USERS_BY_ROLE && G.DB_USERS_BY_ROLE[S.role];
    if(u) S.userId = u.id;
    S._acctOpen = false;
    if(!G.canSeeSection(S.sec)){ S.sec = (G.ROLE_SECTIONS[S.role]||['dash'])[0]; S.tab = 0; }
  },
  'set-lang': (t) => { S.lang = t.dataset.lang; },
  'toggle-acct': () => { S._acctOpen = !S._acctOpen; },
  'toggle-filters': (t) => { const sec = t.dataset.sec; S._filtersOpen = (S._filtersOpen===sec) ? null : sec; },
  'close-filters': () => { S._filtersOpen = null; },
  'clear-filters': (t) => { S.filters[t.dataset.sec] = {}; },
  'table-page': (t) => { S._tablePage = S._tablePage||{}; S._tablePage[t.dataset.sec] = Number(t.dataset.page); },
  'close-modal': () => { G.closeModal(); },
  'modal-save': () => {
    if(S.modal && S.modal.onSave) S.modal.onSave(S.modal.form||{});
  }
});

function findAct(target){
  return target.closest ? target.closest('[data-act]') : null;
}

function attachDelegation(){
  // Trap #1: keep native form controls native.
  document.addEventListener('click', (e) => {
    const tag = e.target.tagName;
    if(tag==='SELECT' || tag==='OPTION') { /* let it open natively, but still allow our handler below via non-capture pass-through */ }
  }, true);

  // Trap #2 (capture phase): close open overlays (account menu / filters
  // drawer / side drawer) on outside click, BEFORE the bubble-phase
  // handler re-renders and the clicked node's context is gone.
  document.addEventListener('click', (e) => {
    if(S._acctOpen && !e.target.closest('.acct-wrap')){ S._acctOpen = false; }
  }, true);

  document.addEventListener('click', (e) => {
    const t = findAct(e.target);
    if(!t) return;
    // Backdrop / stop-propagation guard: clicks inside a modal card must not bubble to the backdrop's close handler.
    if(e.target.closest('[data-stop]') && t.dataset.act !== 'close-modal' && t.dataset.act !== 'modal-save') {
      // fine, still handled below by the actual matched action element
    }
    const act = t.dataset.act;
    const handler = G.ACTIONS[act];
    if(handler){ handler(t, e); G.render(); syncAcctMenu(); }
  });

  // Filter field changes.
  document.addEventListener('change', (e) => {
    const t = e.target;
    if(t.id === 'realImportFiles'){
      // Deliberately does NOT call G.render(): a full re-render replaces
      // this <input> node, which would discard the browser's native file
      // selection before the user gets to click Import. Just update the
      // adjacent label in place instead.
      const label = document.getElementById('uploadFileNames');
      if(label){
        const files = t.files ? Array.from(t.files) : [];
        label.textContent = files.length ? files.map(f=>f.name).join(', ') : 'Файлы не выбраны';
      }
      return;
    }
    if(t.dataset && t.dataset.filterKey){
      const sec = t.dataset.sec;
      S.filters[sec] = S.filters[sec] || {};
      S.filters[sec][t.dataset.filterKey] = t.value;
      G.render();
    }
    if(t.dataset && t.dataset.msVal !== undefined){
      const box = t.closest('.ms-box');
      const sec = box.dataset.sec, key = box.dataset.filterKey;
      const checked = Array.from(box.querySelectorAll('input[type=checkbox]:checked')).map(c=>c.dataset.msVal);
      S.filters[sec] = S.filters[sec]||{};
      S.filters[sec][key] = checked;
      G.render();
    }
    if(t.dataset && t.dataset.mf && S.modal){
      S.modal.form = S.modal.form || {};
      S.modal.form[t.dataset.mf] = (t.type==='checkbox') ? t.checked : t.value;
    }
  });

  // Text/number filter + modal-field typing: update state without a full
  // re-render mid-keystroke would be ideal, but this app re-renders the
  // whole page on every state change — so we preserve focus and caret
  // position across the re-render instead of avoiding it.
  document.addEventListener('input', (e) => {
    const t = e.target;
    let selector = null, pos = null;
    if(t.dataset && t.dataset.filterKey){
      const sec = t.dataset.sec;
      S.filters[sec] = S.filters[sec] || {};
      S.filters[sec][t.dataset.filterKey] = t.value;
      selector = '[data-filter-key="'+t.dataset.filterKey+'"][data-sec="'+sec+'"]';
      pos = t.selectionStart;
      G.render();
    } else if(t.dataset && t.dataset.mf && S.modal){
      S.modal.form = S.modal.form || {};
      S.modal.form[t.dataset.mf] = t.value;
      // modal fields don't need a full render to reflect table changes; skip re-render for smooth typing
      return;
    }
    if(selector){
      requestAnimationFrame(() => {
        const again = document.querySelector(selector);
        if(again){ again.focus(); if(pos!=null && again.setSelectionRange){ try{ again.setSelectionRange(pos,pos); }catch(err){} } }
      });
    }
  });

  // Number inputs: blur on wheel so scrolling the page never changes a value.
  document.addEventListener('wheel', (e) => {
    if(e.target && e.target.tagName==='INPUT' && (e.target.type==='number' || e.target.classList.contains('no-spin'))){
      e.target.blur();
    }
  }, { passive:true });

  document.addEventListener('keydown', (e) => {
    if(e.key==='Escape'){
      if(S.modal){ G.closeModal(); return; }
      if(S._filtersOpen){ S._filtersOpen = null; G.render(); return; }
      if(S.side){ S.side = false; G.render(); }
    }
  });
}

function syncAcctMenu(){
  const m = document.getElementById('acctMenu');
  if(m) m.classList.toggle('open', !!S._acctOpen);
}

function boot(){
  const DB = G.buildDB();
  S.DB = DB;
  G.DB_USERS_BY_ROLE = {};
  DB.users.forEach(u => { if(!G.DB_USERS_BY_ROLE[u.appRole]) G.DB_USERS_BY_ROLE[u.appRole] = u; });
  attachDelegation();
  G.render();
  syncAcctMenu();
}

if(typeof document !== 'undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

global.GC.boot = boot;

})(typeof window !== 'undefined' ? window : globalThis);

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

const CACHE = {};
function getMatcher(lang){
  if(CACHE[lang]) return CACHE[lang];
  const dict = lang==='en' ? RU_EN : (lang==='fr' ? RU_FR : null);
  if(!dict) return null;
  const keys = Object.keys(dict).sort((a,b)=> b.length-a.length).map(escapeRe);
  // Cyrillic-aware boundary: JS \b only recognises [A-Za-z0-9_], so a
  // Cyrillic word like "Работает" would otherwise get clipped mid-string
  // by a naive \b (or not bounded at all) — use an explicit lookaround
  // against the Cyrillic letter range instead.
  const re = new RegExp('(?<![А-Яа-яЁё])(?:' + keys.join('|') + ')(?![А-Яа-яЁё])', 'g');
  const matcher = { re, dict };
  CACHE[lang] = matcher;
  return matcher;
}

function translate(str, matcher){
  if(!str || !matcher) return str;
  if(!/[А-Яа-яЁё]/.test(str)) return str;
  return str.replace(matcher.re, (m) => matcher.dict[m] !== undefined ? matcher.dict[m] : m);
}

function applyI18n(){
  const S = G.S;
  const matcher = getMatcher(S.lang);
  const root = document.getElementById('app');
  if(!root) return;
  if(!matcher) return; // ru: nothing to do, views already render RU natively

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let n;
  while((n = walker.nextNode())) textNodes.push(n);
  textNodes.forEach(node => {
    const t = translate(node.nodeValue, matcher);
    if(t !== node.nodeValue) node.nodeValue = t;
  });

  const attrSel = '[placeholder],[title],[aria-label]';
  root.querySelectorAll(attrSel).forEach(el => {
    ['placeholder','title','aria-label'].forEach(attr => {
      const v = el.getAttribute(attr);
      if(v){ const t = translate(v, matcher); if(t!==v) el.setAttribute(attr, t); }
    });
  });
}

global.GC.applyI18n = applyI18n;
global.GC.I18N = { en: RU_EN, fr: RU_FR };

/* ===== 21. REAL DATA IMPORT — drivers.xlsx / vehicles.xlsx (or .csv)
   uploaded by the user, parsed entirely client-side with no external
   library: a hand-rolled ZIP central-directory reader + the browser's own
   DecompressionStream('deflate-raw') to inflate each part, then DOMParser
   to read sharedStrings.xml and the first sheet's XML. Feeds two
   calculations: financial situation (balances/fines) and vehicle status
   breakdown — both driven purely by the uploaded rows, kept separate from
   the demo dataset so it doesn't orphan the rest of the demo's
   interconnected records (repairs, shifts, etc. reference the demo IDs). */
(function(global){
'use strict';
const G = global.GC, U = G.Utils;
const { esc, cur, pctS, num } = U;
const S = G.S;

/* ---------------- ZIP + XLSX parsing (no external library) ---------------- */

function findEOCD(dv){
  const max = dv.byteLength;
  const searchFrom = Math.max(0, max - 22 - 65557);
  for(let i = max - 22; i >= searchFrom; i--){
    if(dv.getUint32(i, true) === 0x06054b50) return i;
  }
  throw new Error('Не найден конец ZIP-архива (файл повреждён или не .xlsx)');
}

function readZipEntries(buf){
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  const eocd = findEOCD(dv);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const cdCount = dv.getUint16(eocd + 10, true);
  const dec = new TextDecoder('utf-8');
  const entries = {};
  let p = cdOffset;
  for(let i = 0; i < cdCount; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, compSize, localOffset };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return { u8, dv, entries };
}

async function extractEntry(zip, name){
  const e = zip.entries[name];
  if(!e) return null;
  const { u8, dv } = zip;
  const lp = e.localOffset;
  if(dv.getUint32(lp, true) !== 0x04034b50) throw new Error('Повреждён локальный заголовок ZIP для '+name);
  const nameLen = dv.getUint16(lp + 26, true);
  const extraLen = dv.getUint16(lp + 28, true);
  const dataStart = lp + 30 + nameLen + extraLen;
  const compData = u8.subarray(dataStart, dataStart + e.compSize);
  if(e.method === 0) return compData;
  if(e.method === 8){
    if(typeof DecompressionStream === 'undefined'){
      throw new Error('Браузер не поддерживает разбор .xlsx (нет DecompressionStream) — сохраните файл как .csv');
    }
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    writer.write(compData); writer.close();
    const out = await new Response(ds.readable).arrayBuffer();
    return new Uint8Array(out);
  }
  throw new Error('Неподдерживаемый метод сжатия в .xlsx: '+e.method);
}

function parseSharedStrings(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const sis = doc.getElementsByTagName('si');
  const arr = [];
  for(let i = 0; i < sis.length; i++){
    const ts = sis[i].getElementsByTagName('t');
    let text = '';
    for(let j = 0; j < ts.length; j++) text += ts[j].textContent;
    arr.push(text);
  }
  return arr;
}

function colLetterToIndex(letters){
  let n = 0;
  for(let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}

function parseSheetRows(xmlText, sharedStrings){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const rowEls = doc.getElementsByTagName('row');
  const rows = [];
  for(let r = 0; r < rowEls.length; r++){
    const cellEls = rowEls[r].getElementsByTagName('c');
    const row = [];
    for(let c = 0; c < cellEls.length; c++){
      const cell = cellEls[c];
      const ref = cell.getAttribute('r') || '';
      const m = ref.match(/^[A-Z]+/);
      const colIdx = m ? colLetterToIndex(m[0]) : c;
      const type = cell.getAttribute('t');
      const vEl = cell.getElementsByTagName('v')[0];
      let val = null;
      if(type === 's'){ val = vEl ? sharedStrings[parseInt(vEl.textContent, 10)] : ''; }
      else if(type === 'inlineStr'){ const isEl = cell.getElementsByTagName('is')[0]; val = isEl ? isEl.textContent : ''; }
      else if(type === 'b'){ val = vEl ? (vEl.textContent === '1') : false; }
      else if(type === 'str'){ val = vEl ? vEl.textContent : ''; }
      else { val = vEl ? parseFloat(vEl.textContent) : null; }
      row[colIdx] = val;
    }
    rows.push(row);
  }
  return rows;
}

async function parseXlsxArrayBuffer(buf){
  const zip = readZipEntries(buf);
  const dec = new TextDecoder('utf-8');
  let sharedStrings = [];
  const ssBytes = await extractEntry(zip, 'xl/sharedStrings.xml');
  if(ssBytes) sharedStrings = parseSharedStrings(dec.decode(ssBytes));
  const sheetName = zip.entries['xl/worksheets/sheet1.xml'] ? 'xl/worksheets/sheet1.xml'
    : Object.keys(zip.entries).find(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  if(!sheetName) throw new Error('Не найден лист с данными внутри .xlsx');
  const sheetBytes = await extractEntry(zip, sheetName);
  const grid = parseSheetRows(dec.decode(sheetBytes), sharedStrings);
  return gridToObjects(grid);
}

function gridToObjects(grid){
  if(!grid.length) return { headers: [], rows: [] };
  const headerRow = grid[0];
  const headers = headerRow.map(h => (h === undefined || h === null) ? '' : String(h).trim());
  const rows = grid.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => { if(h) obj[h] = r[i] === undefined ? null : r[i]; });
    return obj;
  }).filter(o => Object.values(o).some(v => v !== null && v !== ''));
  return { headers, rows };
}

/* ---------------- CSV fallback (plain text, comma or semicolon) ---------------- */

function parseCsvText(text){
  const lines = text.replace(/^﻿/, '').split(/\r\n|\n/).filter(l => l.length);
  if(!lines.length) return { headers: [], rows: [] };
  const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const splitLine = (line) => {
    const out = []; let cur = ''; let inQ = false;
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      if(ch === '"'){ inQ = !inQ; continue; }
      if(ch === delim && !inQ){ out.push(cur); cur = ''; continue; }
      cur += ch;
    }
    out.push(cur);
    return out;
  };
  const headers = splitLine(lines[0]).map(h => h.trim());
  const rows = lines.slice(1).map(line => {
    const cells = splitLine(line);
    const obj = {};
    headers.forEach((h, i) => { if(h) obj[h] = cells[i] === undefined ? null : cells[i]; });
    return obj;
  });
  return { headers, rows };
}

/* ---------------- file dispatch ---------------- */

async function parseUploadedFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.csv')){
    return parseCsvText(await file.text());
  }
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0, 4));
  const isZip = head[0] === 0x50 && head[1] === 0x4b;
  if(isZip || name.endsWith('.xlsx')) return parseXlsxArrayBuffer(buf);
  return parseCsvText(new TextDecoder('utf-8').decode(buf));
}

function detectKind(headers){
  const has = (h) => headers.includes(h);
  if(has('Phone Number') && has('Balance')) return 'drivers';
  if(has('Plate Number') && has('Status')) return 'vehicles';
  return null;
}

/* ---------------- the two requested calculations ---------------- */

const VEHICLE_STATUS_LABEL = {
  working: 'В работе', maintenance: 'На сервисе', available: 'Свободен',
  police_immobilization: 'Изъят (полиция)'
};
function vehicleStatusLabel(s){ return VEHICLE_STATUS_LABEL[s] || s || '—'; }

function computeFinancialSituation(drivers){
  const n = drivers.length || 1;
  const totalBalance = drivers.reduce((s,d)=>s+d.balance,0);
  const totalFines = drivers.reduce((s,d)=>s+d.fines,0);
  const inDebt = drivers.filter(d=>d.balance<0);
  const inCredit = drivers.filter(d=>d.balance>0);
  const totalDebt = inDebt.reduce((s,d)=>s+d.balance,0); // negative
  const totalCredit = inCredit.reduce((s,d)=>s+d.balance,0);
  const worstDebtors = drivers.slice().sort((a,b)=>a.balance-b.balance).slice(0,5);
  const topCredit = drivers.slice().sort((a,b)=>b.balance-a.balance).slice(0,5);
  const firedCount = drivers.filter(d=>d.fired).length;
  return {
    count: drivers.length, totalBalance, totalFines,
    inDebtCount: inDebt.length, inCreditCount: inCredit.length,
    totalDebt, totalCredit, avgBalance: totalBalance/n,
    worstDebtors, topCredit, firedCount
  };
}

function computeVehicleStatusBreakdown(vehicles){
  const byStatus = {};
  vehicles.forEach(v => { byStatus[v.status||'unknown'] = (byStatus[v.status||'unknown']||0)+1; });
  const total = vehicles.length || 1;
  const rows = Object.keys(byStatus).map(st => ({
    status: st, label: vehicleStatusLabel(st), count: byStatus[st], pct: byStatus[st]/total
  })).sort((a,b)=>b.count-a.count);
  const working = byStatus.working || 0;
  const withoutDriver = vehicles.filter(v=>!v.driverName).length;
  const notWorking = vehicles.filter(v=>v.status!=='working');
  return {
    total: vehicles.length, rows, utilization: working/total,
    withoutDriver, notWorkingList: notWorking
  };
}

/* ---------------- orchestration + UI wiring ---------------- */

async function runRealImport(files){
  const parsed = { drivers: null, vehicles: null };
  for(const file of files){
    const { headers, rows } = await parseUploadedFile(file);
    const kind = detectKind(headers);
    if(kind === 'drivers') parsed.drivers = { fileName: file.name, rows: rows.map(mapDriverRow) };
    else if(kind === 'vehicles') parsed.vehicles = { fileName: file.name, rows: rows.map(mapVehicleRow) };
    else throw new Error('Не удалось распознать файл "'+file.name+'" — ожидались колонки водителей или автомобилей');
  }
  if(!parsed.drivers && !parsed.vehicles) throw new Error('Не найдено ни одного подходящего файла');

  S.DB.realImport = S.DB.realImport || {};
  if(parsed.drivers){ S.DB.realImport.drivers = parsed.drivers.rows; S.DB.realImport.driversFile = parsed.drivers.fileName; }
  if(parsed.vehicles){ S.DB.realImport.vehicles = parsed.vehicles.rows; S.DB.realImport.vehiclesFile = parsed.vehicles.fileName; }
  S.DB.realImport.importedAt = U.NOW;

  const applied = applyRealDataAsPrimary(S.DB);

    + ' (записано водителей: '+applied.driversApplied+', авто: '+applied.vehiclesApplied+')';
}

const REAL_CAR_STATUS = {
  working: 'В работе', maintenance: 'На сервисе', available: 'Свободен', police_immobilization: 'Изъят'
};

// Replaces the demo drivers/vehicles with the uploaded real ones, rebuilds
// the cash ledger from just the real opening balances (that's all the
// source files actually contain — no day-by-day history), and clears every
// collection that has no counterpart in the uploaded files. Those
// collections (repairs, shifts, tickets, incidents, deposits, payouts,
// contracts, leases, inspections, the 9-month KPI model...) would
// otherwise keep showing fabricated demo entries now sitting under real
// people's names and real plates — that's not a reasonable default, so
// they're emptied rather than left stale or invented.
function applyRealDataAsPrimary(DB){
  const ri = DB.realImport;
  if(!ri) return { driversApplied: 0, vehiclesApplied: 0 };

  const newCars = (ri.vehicles || []).filter(v => v.plate).map(v => {
    const div = findOrCreateDiv(DB, v.managerGroup, v.manager);
    return {
      id: 'rv-' + v.plate, plate: v.plate,
      model: (v.brand + ' ' + v.model).trim() || '—',
      year: v.year || null, org: div.org, div: div.id, akpp: 'АКПП', gbo: false,
      status: REAL_CAR_STATUS[v.status] || v.status || 'Свободен',
      insurer: null, insUntil: null, techUntil: null, leaseUntil: null,
      mileage: null, tags: [],
      // fields the demo schema doesn't have but the real export does —
      // surfaced in the car detail modal and docs tab rather than dropped
      oldNumber: v.oldNumber, registrationNumber: v.registrationNumber,
      vinCode: v.vinCode, color: v.color, durationStatus: v.durationStatus,
      insuranceType: v.insuranceType, insurancePolicyNumber: v.insurancePolicyNumber,
      externalYango: v.externalYango, createdAt: v.createdAt,
      _importedManager: v.manager || '', _importedDriverName: v.driverName || ''
    };
  });

  const newDrivers = (ri.drivers || []).filter(d => d.phone || d.name).map(d => {
    const div = findOrCreateDiv(DB, d.managerGroup, '');
    const car = newCars.find(c => c.plate === d.vehiclePlate);
    let status = 'Работает';
    if(d.fired) status = 'Уволен';
    else if(d.activationStatus && d.activationStatus !== 'activated') status = 'Заблокирован';
    return {
      id: 'rd-' + (d.phone || U.uid('drv')), fio: d.name || '—', phone: d.phone || '',
      yid: null, status, ystatus: d.activationStatus === 'activated' ? 'Работает' : 'Нет аккаунта',
      form: 'Штатный', hired: d.activationDate ? d.activationDate.slice(0,10) : null,
      fired: d.fireDate ? d.fireDate.slice(0,10) : null,
      rate: null, balY: 0, bal: 0, finesBal: 0, dmgBal: 0,
      org: div.org, div: div.id, disp: (DB.disp[0] || {}).id, car: car ? car.id : null,
      reportDay: 1, licUntil: d.licenseExpiryDate ? d.licenseExpiryDate.slice(0,10) : null,
      instalment: null, limit: null,
      platformOrders: 0, partnerOrders: 0, blockBelowLimit: false,
      tags: [], notes: d.comment ? [{ by: 'Импорт', text: d.comment, at: U.NOW }] : [],
      active: status !== 'Уволен', _disc: null, gender: d.gender || '',
      // fields the demo schema doesn't have but the real export does
      country: d.country, licenseNumber: d.licenseNumber, idNumber: d.idNumber,
      idExpiryDate: d.idExpiryDate ? d.idExpiryDate.slice(0,10) : null,
      lastLoggedAt: d.lastLoggedAt, activationDate: d.activationDate, createdAt: d.createdAt,
      _importedBalance: d.balance, _importedFines: d.fines
    };
  });

  if(ri.vehicles) DB.cars = newCars;
  if(ri.drivers) DB.drivers = newDrivers;

  // Rebuild the ledger from scratch: one opening entry per real driver for
  // whatever balance/fines the export actually reported — nothing else is
  // known, so nothing else is invented.
  if(ri.drivers){
    DB.cash = [];
    newDrivers.forEach(d => {
      if(d._importedBalance){
        DB.cash.push(G.mkCash(d, U.NOW, d._importedBalance>=0?'Пополнение':'Списание',
          Math.abs(d._importedBalance), 'Система по расписанию', 'Баланс', 'Импорт (начальный баланс)', true));
      }
      if(d._importedFines){
        DB.cash.push(G.mkCash(d, U.NOW, 'Списание', Math.abs(d._importedFines),
          'Система по расписанию', 'Баланс штрафов', 'Импорт (штрафы)', true));
      }
    });
    G.recalcBalances(DB);
  }

  DB.fines = []; DB.instal = []; DB.comps = []; DB.orders = []; DB.orders2 = [];
  DB.acts = []; DB.shifts = []; DB.deposits = []; DB.payouts = []; DB.contracts = [];
  DB.incidents = []; DB.leases = []; DB.tickets = []; DB.inspections = [];
  DB.pnl = []; DB.history = []; DB.dupes = []; DB._dispatch = [];
  DB._collection = { perDriver: {}, months: (DB._collection && DB._collection.months) || [] };
  DB._kpi = [];
  DB._realDataIsPrimary = true;

  return { driversApplied: newDrivers.length, vehiclesApplied: newCars.length };
}

function financialSituationHTML(fs){
  let html = '<div class="grid grid-4">'
    + G.helpers.statTile('Общий баланс', cur(fs.totalBalance), fs.count+' водителей', fs.totalBalance>=0?'up':'down')
    + G.helpers.statTile('Водителей с долгом', fs.inDebtCount, 'из '+fs.count, fs.inDebtCount>fs.count/2?'down':'up')
    + G.helpers.statTile('Общий долг', cur(Math.abs(fs.totalDebt)), 'сумма отрицательных балансов', 'down')
    + G.helpers.statTile('Средний баланс', cur(fs.avgBalance), 'на водителя', fs.avgBalance>=0?'up':'down')
    + '</div>';
  html += '<div class="grid grid-2">';
  html += '<div class="card"><div class="card-head"><h3>Топ-5 должников</h3></div>'
    + G.tableHTML([
        {label:'Водитель', key:'name'}, {label:'Телефон', key:'phone'},
        {label:'Баланс', render:d=>'<span style="color:var(--bad)">'+cur(d.balance)+'</span>'}
      ], fs.worstDebtors, {}) + '</div>';
  html += '<div class="card"><div class="card-head"><h3>Топ-5 по балансу</h3></div>'
    + G.tableHTML([
        {label:'Водитель', key:'name'}, {label:'Телефон', key:'phone'},
        {label:'Баланс', render:d=>'<span style="color:var(--ok)">'+cur(d.balance)+'</span>'}
      ], fs.topCredit, {}) + '</div>';
  html += '</div>';
  return html;
}
function vehicleStatusHTML(vs){
  const colors = { working:'#2e9e5b', maintenance:'#c9891c', available:'#4a90d9', police_immobilization:'#d64545' };
  let html = '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">'
    + G.donut(vs.rows.map(r=>({value:r.count, color: colors[r.status]||'#999'})), 120)
    + '<div class="grid grid-3" style="flex:1">'
    + G.helpers.statTile('Всего автомобилей', vs.total, '')
    + G.helpers.statTile('Утилизация (в работе)', pctS(vs.utilization), '')
    + G.helpers.statTile('Без водителя', vs.withoutDriver, '')
    + '</div></div>';
  html += G.tableHTML([
    {label:'Статус', render:r=>'<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(colors[r.status]||'#999')+';margin-right:6px"></span>'+esc(r.label)},
    {label:'Количество', key:'count'}, {label:'Доля', render:r=>pctS(r.pct)}
  ], vs.rows, { title:'Статусы автопарка' });
  return html;
}

function realImportResultsHTML(){
  const ri = S.DB.realImport;
  if(!ri || (!ri.drivers && !ri.vehicles)) return '';
  let html = '<div class="card"><div class="card-head"><h3>Загруженные файлы</h3></div>'
    + '<div class="muted">'
    + (ri.driversFile ? 'Водители: '+esc(ri.driversFile)+' · ' : '')
    + (ri.vehiclesFile ? 'Автомобили: '+esc(ri.vehiclesFile)+' · ' : '')
    + 'Импортировано: '+U.fmtDT(ri.importedAt)
    + '</div></div>';
  if(ri.drivers) html += financialSituationHTML(computeFinancialSituation(ri.drivers));
  if(ri.vehicles) html += vehicleStatusHTML(computeVehicleStatusBreakdown(ri.vehicles));
  return html;
}

Object.assign(G.ACTIONS, {
  'do-real-import': (t) => {
    const input = document.getElementById('realImportFiles');
    const files = (input && input.files) ? Array.from(input.files) : [];
    if(!files.length){ G.toast('Выберите один или два файла (водители / автомобили)'); return; }
    S._importBusy = true;
    runRealImport(files).then(summary => {
      S._importBusy = false;
      G.toast(summary);
      G.render();
    }).catch(err => {
      S._importBusy = false;
      G.toast('Ошибка импорта: '+err.message);
      G.render();
    });
  }
});

global.GC.realImportResultsHTML = realImportResultsHTML;
global.GC.computeFinancialSituation = computeFinancialSituation;
global.GC.computeVehicleStatusBreakdown = computeVehicleStatusBreakdown;
global.GC.parseUploadedFile = parseUploadedFile; // exposed for headless testing

})(typeof window !== 'undefined' ? window : globalThis);

</script>
